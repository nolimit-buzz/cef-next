name: Build and push frontend image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: syntaxdesigner
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            syntaxdesigner/cef-next:latest
            syntaxdesigner/cef-next:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STRAPI_URL=${{ vars.NEXT_PUBLIC_STRAPI_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Requires the DOKPLOY_DEPLOY_WEBHOOK secret to be set in the repo;
      # the step is skipped (not failed) if it isn't configured yet. (A step
      # can't read its own `env:` block inside its own `if:`, so the guard
      # checks `secrets` directly instead.)
      - name: Trigger Dokploy redeploy
        if: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK != '' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl -fsSL -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
