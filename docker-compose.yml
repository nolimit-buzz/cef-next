services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty unless set on the host — the build then falls back to .env.
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: cef-frontend:latest
    container_name: cef-frontend
    # HOST_PORT is the port exposed on the machine; PORT is what the app
    # listens on inside the container. Both come from .env.
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    # Server-side runtime vars: Brevo credentials and the CMS base URL.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3


